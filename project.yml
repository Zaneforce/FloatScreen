name: FloatScreen
options:
  bundleIdPrefix: com.floatscreen
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  FloatScreen:
    type: application
    platform: macOS
    sources:
      - path: FloatScreen
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floatscreen.app
        INFOPLIST_FILE: FloatScreen/Info.plist
        CODE_SIGN_ENTITLEMENTS: FloatScreen/FloatScreen.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: FloatScreen
        COMBINE_HIDPI_IMAGES: true
    dependencies:
      - framework: WebKit.framework
        embed: false
