name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Compute numeric build number: 1.0.1 -> 10001, 2.3.4 -> 20304
          IFS='.' read -r major minor patch <<< "$VERSION"
          BUILD_NUMBER=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM packages
        run: |
          xcodebuild -project FloatScreen.xcodeproj -scheme FloatScreen \
            -resolvePackageDependencies

      - name: Build universal app
        run: |
          xcodebuild -project FloatScreen.xcodeproj -scheme FloatScreen \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=${{ steps.version.outputs.VERSION }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.BUILD_NUMBER }} \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Create ZIP and DMG
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd build/DerivedData/Build/Products/Release
          ditto -c -k --keepParent FloatScreen.app \
            "$RUNNER_TEMP/release/FloatScreen-${{ steps.version.outputs.VERSION }}.zip"
          hdiutil create -volname "FloatScreen" \
            -srcfolder FloatScreen.app \
            -ov -format UDZO \
            "$RUNNER_TEMP/release/FloatScreen-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Sign update with Sparkle
        run: |
          SPARKLE_BIN=$(find build/DerivedData/SourcePackages -name "sign_update" -type f | head -1)
          if [ -z "$SPARKLE_BIN" ]; then
            echo "::warning::sign_update not found, skipping Sparkle signing"
            echo "SPARKLE_SIGNATURE=" >> "$GITHUB_ENV"
            exit 0
          fi
          SIGNATURE=$("$SPARKLE_BIN" \
            "$RUNNER_TEMP/release/FloatScreen-${{ steps.version.outputs.VERSION }}.zip" \
            -s "${{ secrets.SPARKLE_PRIVATE_KEY }}" 2>&1 || true)
          echo "SPARKLE_SIGNATURE<<EOF" >> "$GITHUB_ENV"
          echo "$SIGNATURE" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Generate appcast.xml
        run: |
          ZIP="$RUNNER_TEMP/release/FloatScreen-${{ steps.version.outputs.VERSION }}.zip"
          ZIP_SIZE=$(stat -f%z "$ZIP")
          mkdir -p "$RUNNER_TEMP/pages"
          cat > "$RUNNER_TEMP/pages/appcast.xml" << 'HEREDOC'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>FloatScreen</title>
              <item>
          HEREDOC
          cat >> "$RUNNER_TEMP/pages/appcast.xml" << HEREDOC
                <title>Version ${{ steps.version.outputs.VERSION }}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${{ steps.version.outputs.BUILD_NUMBER }}</sparkle:version>
                <sparkle:shortVersionString>${{ steps.version.outputs.VERSION }}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure url="https://github.com/Zaneforce/FloatScreen/releases/download/v${{ steps.version.outputs.VERSION }}/FloatScreen-${{ steps.version.outputs.VERSION }}.zip"
                  length="${ZIP_SIZE}"
                  type="application/octet-stream"
                  sparkle:edSignature="${SPARKLE_SIGNATURE}" />
              </item>
            </channel>
          </rss>
          HEREDOC

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.VERSION }}" \
            "$RUNNER_TEMP/release/FloatScreen-${{ steps.version.outputs.VERSION }}.zip" \
            "$RUNNER_TEMP/release/FloatScreen-${{ steps.version.outputs.VERSION }}.dmg" \
            --title "v${{ steps.version.outputs.VERSION }}" \
            --notes "FloatScreen ${{ steps.version.outputs.VERSION }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish appcast to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/pages
          keep_files: true
